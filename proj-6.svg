<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0d"/>
      <stop offset="100%" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="panel6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1e24"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#sky6)"/>
  <!-- Commercial building roof -->
  <rect x="60" y="500" width="780" height="220" rx="8" fill="#121417" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="60" y="500" width="780" height="14" fill="#0f1115"/>
  <!-- Solar panels on roof -->
  <g fill="#1b1e24" stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <rect x="110" y="540" width="260" height="120" rx="4"/>
    <rect x="390" y="530" width="260" height="120" rx="4"/>
    <rect x="670" y="550" width="170" height="100" rx="4"/>
    <rect x="110" y="680" width="260" height="120" rx="4"/>
    <rect x="390" y="670" width="260" height="120" rx="4"/>
    <rect x="670" y="670" width="170" height="100" rx="4"/>
  </g>
  <g fill="rgba(201,162,39,0.13)">
    <rect x="110" y="540" width="260" height="6" rx="2"/>
    <rect x="390" y="530" width="260" height="6" rx="2"/>
    <rect x="670" y="550" width="170" height="6" rx="2"/>
    <rect x="110" y="680" width="260" height="6" rx="2"/>
    <rect x="390" y="670" width="260" height="6" rx="2"/>
    <rect x="670" y="670" width="170" height="6" rx="2"/>
  </g>
  <!-- Inverter on wall -->
  <rect x="330" y="740" width="240" height="140" rx="10" fill="#0f1115" stroke="rgba(201,162,39,0.25)" stroke-width="1"/>
  <text x="450" y="778" font-family="Tajawal, Inter, sans-serif" font-size="17" font-weight="700" fill="#c9a227" text-anchor="middle">COMMERCIAL INVERTER</text>
  <text x="450" y="800" font-family="Tajawal, Inter, sans-serif" font-size="14" fill="#b9beba" text-anchor="middle">Facility PV System</text>
  <!-- Glow sun -->
  <circle cx="800" cy="320" r="85" fill="rgba(201,162,39,0.11)" filter="url(#blur6)"/>
  <circle cx="800" cy="320" r="32" fill="rgba(201,162,39,0.25)" filter="url(#blur6)"/>
  <rect x="0" y="1140" width="900" height="60" fill="#0f1012"/>
  <text x="450" y="1170" font-family="Tajawal, Inter, sans-serif" font-size="22" font-weight="800" fill="#c9a227" text-anchor="middle" letter-spacing="0.1em">COMMERCIAL SOLAR SYSTEM</text>
</svg>