<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0d"/>
      <stop offset="100%" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16191e"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#sky4)"/>
  <!-- Inverter cabinet -->
  <rect x="220" y="430" width="460" height="560" rx="16" fill="url(#invGrad)" stroke="rgba(201,162,39,0.3)" stroke-width="2"/>
  <rect x="240" y="450" width="420" height="70" rx="8" fill="#0f1115" stroke="rgba(201,162,39,0.25)" stroke-width="1"/>
  <text x="450" y="492" font-family="Tajawal, Inter, sans-serif" font-size="24" font-weight="800" fill="#c9a227" text-anchor="middle" letter-spacing="0.08em">SOLAR INVERTER</text>
  <text x="450" y="518" font-family="Tajawal, Inter, sans-serif" font-size="16" fill="#b9beba" text-anchor="middle">50 kW • Grid-Tied / Hybrid</text>
  <!-- Display panel -->
  <rect x="280" y="560" width="340" height="160" rx="10" fill="#0a0b0c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="320" y="610" font-family="Tajawal, Inter, sans-serif" font-size="20" font-weight="700" fill="#c9a227">48.2 kW</text>
  <text x="720" y="610" font-family="Tajawal, Inter, sans-serif" font-size="16" fill="#b9beba" text-anchor="end">ACTIVE</text>
  <text x="320" y="645" font-family="Tajawal, Inter, sans-serif" font-size="15" fill="#b9beba">DC Input  •  600 V</text>
  <text x="320" y="675" font-family="Tajawal, Inter, sans-serif" font-size="15" fill="#b9beba">AC Output  •  400 V</text>
  <!-- Status LEDs -->
  <g fill="#4a9e5c">
    <circle cx="300" cy="710" r="8"/>
    <circle cx="325" cy="710" r="8"/>
    <circle cx="350" cy="710" r="8"/>
  </g>
  <text x="300" y="728" font-family="Tajawal, Inter, sans-serif" font-size="14" fill="#b9beba">SYSTEM OK</text>
  <!-- Connection terminals -->
  <g stroke="rgba(201,162,39,0.35)" stroke-width="2" fill="none">
    <line x1="300" y1="830" x2="300" y2="860"/>
    <line x1="450" y1="830" x2="450" y2="860"/>
    <line x1="600" y1="830" x2="600" y2="860"/>
  </g>
  <g fill="#c9a227" opacity="0.9">
    <rect x="294" y="860" width="12" height="24" rx="3"/>
    <rect x="444" y="860" width="12" height="24" rx="3"/>
    <rect x="594" y="860" width="12" height="24" rx="3"/>
  </g>
  <circle cx="180" cy="300" r="70" fill="rgba(201,162,39,0.10)" filter="url(#blur4)"/>
  <circle cx="180" cy="300" r="28" fill="rgba(201,162,39,0.24)" filter="url(#blur4)"/>
  <rect x="0" y="1140" width="900" height="60" fill="#0f1012"/>
  <text x="450" y="1170" font-family="Tajawal, Inter, sans-serif" font-size="22" font-weight="800" fill="#c9a227" text-anchor="middle" letter-spacing="0.1em">SOLAR INVERTER INSTALLATION</text>
</svg>