<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1114"/>
      <stop offset="100%" stop-color="#1a1d21"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#sky2)"/>
  <!-- Large tilted solar PV array -->
  <g transform="rotate(-12, 450, 600)">
    <rect x="60" y="460" width="780" height="320" rx="10" fill="url(#panel2)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <g fill="#1e2228" stroke="rgba(255,255,255,0.04)" stroke-width="1">
      <rect x="100" y="500" width="240" height="90" rx="4"/>
      <rect x="360" y="500" width="240" height="90" rx="4"/>
      <rect x="620" y="500" width="180" height="90" rx="4"/>
      <rect x="100" y="610" width="240" height="90" rx="4"/>
      <rect x="360" y="610" width="240" height="90" rx="4"/>
      <rect x="620" y="610" width="180" height="90" rx="4"/>
    </g>
    <g fill="rgba(201,162,39,0.14)">
      <rect x="100" y="500" width="240" height="5" rx="2"/>
      <rect x="360" y="500" width="240" height="5" rx="2"/>
      <rect x="620" y="500" width="180" height="5" rx="2"/>
      <rect x="100" y="610" width="240" height="5" rx="2"/>
      <rect x="360" y="610" width="240" height="5" rx="2"/>
      <rect x="620" y="610" width="180" height="5" rx="2"/>
    </g>
  </g>
  <!-- Mounting rails -->
  <g stroke="rgba(201,162,39,0.25)" stroke-width="3" fill="none">
    <line x1="60" y1="780" x2="840" y2="780"/>
    <line x1="60" y1="800" x2="840" y2="800"/>
  </g>
  <circle cx="220" cy="300" r="90" fill="rgba(201,162,39,0.10)" filter="url(#blur2)"/>
  <circle cx="220" cy="300" r="35" fill="rgba(201,162,39,0.24)" filter="url(#blur2)"/>
  <rect x="0" y="1140" width="900" height="60" fill="#0f1012"/>
  <text x="450" y="1170" font-family="Tajawal, Inter, sans-serif" font-size="22" font-weight="800" fill="#c9a227" text-anchor="middle" letter-spacing="0.1em">LARGE SOLAR PV ARRAY</text>
</svg>