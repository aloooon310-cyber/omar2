<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181c"/>
      <stop offset="100%" stop-color="#0f1012"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6f1f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#0a0b0c"/>
  <!-- Outer engineering frame -->
  <rect x="60" y="60" width="1080" height="1080" rx="24" fill="none" stroke="url(#frame)" stroke-width="4" opacity="0.55"/>
  <rect x="80" y="80" width="1040" height="1040" rx="18" fill="none" stroke="rgba(201,162,39,0.2)" stroke-width="2"/>
  <!-- Title label -->
  <text x="600" y="170" font-family="Tajawal, Inter, sans-serif" font-size="30" font-weight="800" fill="#c9a227" text-anchor="middle" letter-spacing="0.12em">SOLAR ENGINEERING</text>
  <text x="600" y="210" font-family="Tajawal, Inter, sans-serif" font-size="20" fill="#b9beba" text-anchor="middle" letter-spacing="0.06em">Renewable Energy Systems</text>
  <!-- Central solar panel array -->
  <g transform="translate(180, 300)">
    <rect x="0" y="0" width="840" height="520" rx="12" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Panel cells -->
    <g fill="#1e2228" stroke="rgba(255,255,255,0.05)" stroke-width="1">
      <rect x="20" y="30" width="260" height="140" rx="4"/>
      <rect x="300" y="30" width="260" height="140" rx="4"/>
      <rect x="580" y="30" width="240" height="140" rx="4"/>
      <rect x="20" y="190" width="260" height="140" rx="4"/>
      <rect x="300" y="190" width="260" height="140" rx="4"/>
      <rect x="580" y="190" width="240" height="140" rx="4"/>
      <rect x="20" y="350" width="260" height="140" rx="4"/>
      <rect x="300" y="350" width="260" height="140" rx="4"/>
      <rect x="580" y="350" width="240" height="140" rx="4"/>
    </g>
    <!-- Cell top highlight -->
    <g fill="rgba(201,162,39,0.14)">
      <rect x="20" y="30" width="260" height="5" rx="2"/>
      <rect x="300" y="30" width="260" height="5" rx="2"/>
      <rect x="580" y="30" width="240" height="5" rx="2"/>
      <rect x="20" y="190" width="260" height="5" rx="2"/>
      <rect x="300" y="190" width="260" height="5" rx="2"/>
      <rect x="580" y="190" width="240" height="5" rx="2"/>
      <rect x="20" y="350" width="260" height="5" rx="2"/>
      <rect x="300" y="350" width="260" height="5" rx="2"/>
      <rect x="580" y="350" width="240" height="5" rx="2"/>
    </g>
    <!-- Inverter / junction box -->
    <rect x="640" y="500" width="160" height="100" rx="8" fill="#0f1012" stroke="rgba(201,162,39,0.35)" stroke-width="2"/>
    <text x="720" y="555" font-family="Tajawal, Inter, sans-serif" font-size="16" font-weight="700" fill="#c9a227" text-anchor="middle">INVERTER</text>
    <!-- Battery storage -->
    <rect x="20" y="500" width="140" height="100" rx="8" fill="#0f1012" stroke="rgba(74,158,92,0.35)" stroke-width="2"/>
    <text x="90" y="555" font-family="Tajawal, Inter, sans-serif" font-size="16" font-weight="700" fill="#4a9e5c" text-anchor="middle">BATTERY</text>
  </g>
  <!-- Technical grid dots -->
  <g fill="#c9a227" opacity="0.12">
    <circle cx="240" cy="920" r="2.5"/>
    <circle cx="420" cy="940" r="2.5"/>
    <circle cx="640" cy="910" r="2.5"/>
    <circle cx="860" cy="930" r="2.5"/>
    <circle cx="1040" cy="950" r="2.5"/>
    <circle cx="300" cy="1040" r="2.5"/>
    <circle cx="520" cy="1020" r="2.5"/>
    <circle cx="760" cy="1050" r="2.5"/>
    <circle cx="940" cy="1030" r="2.5"/>
    <circle cx="200" cy="1140" r="2.5"/>
    <circle cx="440" cy="1120" r="2.5"/>
    <circle cx="680" cy="1150" r="2.5"/>
    <circle cx="900" cy="1130" r="2.5"/>
    <circle cx="1080" cy="1160" r="2.5"/>
  </g>
  <!-- Bottom specs strip -->
  <rect x="180" y="1000" width="840" height="120" rx="10" fill="#121417" stroke="rgba(201,162,39,0.2)" stroke-width="1"/>
  <text x="220" y="1045" font-family="Tajawal, Inter, sans-serif" font-size="18" font-weight="700" fill="#f5f5f0">PV Array  •  100 kWp</text>
  <text x="220" y="1078" font-family="Tajawal, Inter, sans-serif" font-size="15" fill="#b9beba">Monocrystalline • MPPT Controller • LiFePO4 Storage</text>
  <text x="780" y="1045" font-family="Tajawal, Inter, sans-serif" font-size="18" font-weight="700" fill="#c9a227" text-anchor="end">Efficiency up to 22%</text>
  <text x="780" y="1078" font-family="Tajawal, Inter, sans-serif" font-size="15" fill="#b9beba" text-anchor="end">Grid-Tied + Hybrid</text>
  <!-- Corner markers -->
  <g stroke="rgba(201,162,39,0.45)" stroke-width="2" fill="none">
    <path d="M60 60 L110 60 M60 60 L60 110"/>
    <path d="M1140 60 L1090 60 M1140 60 L1140 110"/>
    <path d="M60 1140 L110 1140 M60 1140 L60 1090"/>
    <path d="M1140 1140 L1090 1140 M1140 1140 L1140 1090"/>
  </g>
</svg>